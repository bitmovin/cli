name: Pack installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  pack-tarballs-and-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install NSIS for Windows .exe
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Pack tarballs (all targets)
        run: npx oclif pack tarballs --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64
      - name: Pack Windows .exe (win32-x64 only)
        run: npx oclif pack win --targets=win32-x64
      - name: Upload tarballs + Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-tarballs-and-windows
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/win32/*.exe
          if-no-files-found: error
          retention-days: 30

  pack-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Pack tarballs (darwin targets, needed by pack:macos)
        run: npx oclif pack tarballs --targets=darwin-x64,darwin-arm64
      - name: Pack macOS .pkg
        run: npx oclif pack macos
      - name: Upload macOS .pkg installers
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-macos
          path: dist/macos/*.pkg
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: [pack-tarballs-and-windows, pack-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded files
        run: find artifacts -type f -exec ls -lh {} \;
      - name: Create draft release with installers as individual assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/bitmovin-cli-tarballs-and-windows/*.tar.gz
            artifacts/bitmovin-cli-tarballs-and-windows/*.tar.xz
            artifacts/bitmovin-cli-tarballs-and-windows/*.exe
            artifacts/bitmovin-cli-macos/*.pkg
