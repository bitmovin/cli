name: Pack installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci-passed:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to succeed on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag push and the branch push that triggers ci.yml race: this
          # gate fires immediately on tag push, while the build-and-test checks
          # for the same SHA are still queued/in_progress. Poll until they reach
          # a terminal state instead of reading their (null) conclusion too early.
          TIMEOUT_SECONDS: '900'
          POLL_SECONDS: '15'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          while :; do
            runs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("build-and-test")) | {name, status, conclusion}]')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$total" -eq 0 ]; then
                echo "::error::No build-and-test check runs found for ${{ github.sha }} within ${TIMEOUT_SECONDS}s — was CI ever triggered?"
              else
                echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for build-and-test checks to complete on ${{ github.sha }}"
                echo "$runs" | jq .
              fi
              exit 1
            fi
            echo "Waiting for build-and-test checks on ${{ github.sha }} (found ${total}, ${pending} not yet completed)…"
            sleep "$POLL_SECONDS"
          done

          conclusions=$(echo "$runs" | jq -c '[.[].conclusion]')
          echo "build-and-test conclusions on ${{ github.sha }}: $conclusions"
          if echo "$conclusions" | grep -qvE '^\[("success",?\s*)+\]$'; then
            echo "::error::At least one build-and-test check on ${{ github.sha }} did not succeed"
            exit 1
          fi
          echo "CI green on ${{ github.sha }} ✓"

  publish-npm:
    needs: ci-passed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pack-tarballs-and-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install NSIS for Windows .exe
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Pack tarballs (all targets)
        run: npx oclif pack tarballs --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64
      - name: Pack Windows .exe (win32-x64 only)
        run: npx oclif pack win --targets=win32-x64
      - name: Upload tarballs + Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-tarballs-and-windows
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/win32/*.exe
          if-no-files-found: error
          retention-days: 30

  pack-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Import Developer ID Installer cert into temp keychain
        env:
          INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          P12_PATH="$RUNNER_TEMP/installer.p12"
          echo "$INSTALLER_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12_PATH"
          security find-identity -v -p basic "$KEYCHAIN_PATH"
      - name: Pack tarballs (darwin targets, needed by pack:macos)
        run: npx oclif pack tarballs --targets=darwin-x64,darwin-arm64
      - name: Pack macOS .pkg (signed with Developer ID Installer)
        run: npx oclif pack macos
      - name: Verify .pkg signatures
        run: |
          set -e
          for pkg in dist/macos/*.pkg; do
            echo "=== $pkg ==="
            pkgutil --check-signature "$pkg"
            echo
          done
      - name: Upload macOS .pkg installers
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-macos
          path: dist/macos/*.pkg
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: [ci-passed, pack-tarballs-and-windows, pack-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bitmovin-cli-*
          path: artifacts
      - name: Compute SHA256SUMS for release assets
        run: |
          set -e
          cd artifacts
          {
            find bitmovin-cli-tarballs-and-windows -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.exe' \)
            find bitmovin-cli-macos -type f -name '*.pkg'
          } | while read -r f; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s  %s\n' "$hash" "$(basename "$f")"
          done | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release with installer assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/bitmovin-cli-tarballs-and-windows/*.tar.gz
            artifacts/bitmovin-cli-tarballs-and-windows/*.tar.xz
            artifacts/bitmovin-cli-tarballs-and-windows/win32/*.exe
            artifacts/bitmovin-cli-macos/*.pkg
            artifacts/SHA256SUMS
