name: Pack installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pack tooling (nsis for .exe, bomutils + xar for .pkg)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis bomutils xar
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Pack tarballs
        run: npx oclif pack tarballs --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64
      - name: Pack macOS .pkg (darwin-x64, darwin-arm64)
        run: npx oclif pack macos
      - name: Pack Windows .exe (win32-x64)
        run: npx oclif pack win
      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-installers
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/macos/*.pkg
            dist/win32/*.exe
          if-no-files-found: error
          retention-days: 30
