name: Pack tarballs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx oclif manifest
      - name: Pack tarballs
        run: npx oclif pack tarballs --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64
      - name: Upload tarballs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitmovin-cli-tarballs
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
          if-no-files-found: error
          retention-days: 30
